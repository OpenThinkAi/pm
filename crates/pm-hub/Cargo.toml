[package]
name = "pm-hub"
version.workspace = true
edition.workspace = true
description = "pm-hub — the sync hub: Postgres-backed op log, sequence and auth (README §Sync & hub)"
license.workspace = true
repository.workspace = true

# The hub links `pm-core` so merge and claim rules stay identical to the
# CLI's (README §Sync & hub). Postgres goes through `tokio-postgres` with
# runtime (not compile-time-checked) queries, so building never needs a
# live database. No TLS: the hub reaches Postgres over Railway's private
# network (`postgres.railway.internal`), which has no public TCP proxy.
[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.3"
pm-core = { path = "../pm-core" }
serde = { version = "1.0", features = ["derive"] }
# `raw_value` keeps each pushed op's JSON text as received, so the hub
# stores and serves the exact bytes (README §Sync & hub: opaque storage).
serde_json = { version = "1.0", features = ["raw_value"] }
# sha2 0.11 is the release tokio-postgres (postgres-protocol) already links.
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-postgres = "0.7"
# Fresh `op_id`s for the ops the hub authors itself (`numbers`).
ulid = "1.2"

[dev-dependencies]
# The claims tests build a client log with pm-store and compare the hub's
# views with the client's own rebuild of it (AGT-1392).
pm-store = { path = "../pm-store" }
tempfile = "3.27"
