[package]
name = "pm"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pm-core = { path = "../pm-core" }
pm-store = { path = "../pm-store" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `pm new --from-file` / `--batch` (AGT-1346): vault ticket files and batch
# specs are YAML. `serde_yaml` is archived (dtolnay, 2024) and its forks
# either sit on `unsafe-libyaml` (`serde_yaml_ng`, `serde_norway`; AGT-1465
# drops it: archived, unsafe C-port) or are unmaintained (`serde_yml`).
# `serde-saphyr` is actively maintained, pure Rust with no unsafe code, and
# panic-free by design. It has no dynamic `Value`, so callers deserialize
# into `serde_json::Value` (same scalar/sequence/map shapes).
serde-saphyr = "1.3"
# `~/.config/pm/config.toml` (README §Surfaces). Later config keys
# (`edit.view`, hub settings) land in the same file.
toml = "1.1"
# `pm hub status`/`login` (AGT-1394): a small blocking HTTP client. ureq 3
# with only the rustls feature (no gzip, json, cookies, or native-tls):
# hub calls are two tiny GETs, and the JSON is parsed with serde_json.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
ulid = { version = "1.2", features = ["serde"] }
# `pm app` (AGT-1401): the localhost API the ui-leaf views talk to. axum
# and tokio are the versions `crates/pm-hub` already locks; `getrandom`
# mints the one-shot token from the OS CSPRNG as pm-hub mints its tokens;
# `futures-util` (already in the tree under axum) builds the SSE stream.
# `process` + `io-util` (AGT-1402): pm drives the ui-leaf child over its
# line-delimited stdio protocol alongside the server (adds only tokio's
# own `signal-hook-registry`).
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

# The view-cache fingerprint (AGT-1465) and the vendored-bundle manifest
# test (AGT-1452); the release pm-hub and postgres-protocol already lock.
sha2 = "0.11"

[dev-dependencies]
# Tests corrupt a materialized row directly to prove `pm doctor` catches it.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
tempfile = "3.27"
# `tests/sync.rs` (AGT-1395) runs the real `pm-hub` against a throwaway
# Postgres through pm-hub's own test harness (`crates/pm-hub/tests/common`,
# included by path), which reaches Postgres with tokio-postgres (already in
# the lockfile for pm-hub; tokio itself is a regular dependency above).
tokio-postgres = "0.7"
