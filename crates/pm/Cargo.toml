[package]
name = "pm"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pm-core = { path = "../pm-core" }
pm-store = { path = "../pm-store" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `~/.config/pm/config.toml` (README §Surfaces). Later config keys
# (`edit.view`, hub settings) land in the same file.
toml = "1.1"
ulid = { version = "1.2", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27"
