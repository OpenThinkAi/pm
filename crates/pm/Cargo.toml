[package]
name = "pm"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pm-core = { path = "../pm-core" }
pm-store = { path = "../pm-store" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `pm new --from-file` / `--batch` (AGT-1346): vault ticket files and batch
# specs are YAML. `serde_yaml` is deprecated (archived by dtolnay, Nov
# 2024) with no further releases. Of the forks that stepped in:
# `serde_yml` (sebastienrousseau) now ships its own crate-level notice
# calling itself unmaintained and redirecting elsewhere — the exact
# provenance risk this ticket asked to check for, so it is ruled out.
# `serde_yaml_ng` is a straight fork by an identifiable, existing Rust
# maintainer (acatton), keeps `serde_yaml`'s exact API (so this crate's
# usage is a drop-in), stayed on the MIT license, and is the fork most
# commonly pointed to as the migration target since the deprecation.
serde_yaml_ng = "0.10"
# `~/.config/pm/config.toml` (README §Surfaces). Later config keys
# (`edit.view`, hub settings) land in the same file.
toml = "1.1"
# `pm hub status`/`login` (AGT-1394): a small blocking HTTP client. ureq 3
# with only the rustls feature (no gzip, json, cookies, or native-tls):
# hub calls are two tiny GETs, and the JSON is parsed with serde_json.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
ulid = { version = "1.2", features = ["serde"] }
# `pm app` (AGT-1401): the localhost API the ui-leaf views talk to. axum
# and tokio are the versions `crates/pm-hub` already locks; `getrandom`
# mints the one-shot token from the OS CSPRNG as pm-hub mints its tokens;
# `futures-util` (already in the tree under axum) builds the SSE stream.
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# Tests corrupt a materialized row directly to prove `pm doctor` catches it.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
tempfile = "3.27"
# `tests/sync.rs` (AGT-1395) runs the real `pm-hub` against a throwaway
# Postgres through pm-hub's own test harness (`crates/pm-hub/tests/common`,
# included by path), which reaches Postgres with tokio-postgres (already in
# the lockfile for pm-hub; tokio itself is a regular dependency above).
tokio-postgres = "0.7"
