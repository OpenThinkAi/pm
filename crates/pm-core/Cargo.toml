[package]
name = "pm-core"
version.workspace = true
edition.workspace = true
publish = false
description.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# pm-core is pure: no IO, no SQLite, no filesystem access. It holds domain
# types, op types, merge rules and HLC logic shared by the `pm` CLI and
# (later) `pm-hub`, so merge semantics are identical everywhere. See
# AGT-1333 and crates/pm/tests/pm_core_purity.rs, which enforces this.
[dependencies]
# Text CRDT for ticket bodies / project docs (spike O1, AGT-1338; decision
# and numbers in the vault at projects/pm/research/text-crdt-spike.md).
# In-memory only: no IO crates in its closure. `counter` is Loro's default
# feature (a counter container pm does not use); turning defaults off drops it.
loro = { version = "1.16.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ulid = { version = "1.2", features = ["serde"] }

[dev-dependencies]
proptest = "1.7"
# Comparison baseline for examples/text_crdt_bench.rs only. Pinned below
# 0.27: yrs 0.27.0+ uses `if let` guards, which need rustc >= 1.95, and the
# crate declares no rust-version, so it silently fails to build on the 1.94
# toolchain this repo's stamp required_checks run on.
yrs = "0.26.0"
