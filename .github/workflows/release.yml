#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
# HAND-EDIT (dist generates `contents: write` here): least privilege by
# default. Jobs that compile code (and so run third-party build scripts) get
# a read-only token; only `host` (creates the GitHub Release + attestations)
# and `publish-npm` (OIDC) are granted more, at job level.
permissions:
  "contents": "read"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
# Trigger: on push to main (matches OpenThinkAi pattern). Reads version
# from Cargo.toml; if @openthink/pm@<version> is already on npm, every other
# job short-circuits via `needs.plan.outputs.publishing == 'false'`.
#
# Acknowledged regressions vs the prior hand-rolled workflow:
#
#   1. Partial-failure recovery is dist-managed, not gh-managed.
#      The previous workflow had explicit `gh release view ... --clobber`
#      logic so a created-but-not-uploaded release could be recovered by
#      re-pushing. dist's host job manages the release lifecycle through
#      its own draft → upload → release steps. If a run fails mid-flight
#      (npm publish fails, network blip during upload), see the recovery
#      procedure in RELEASING.md.
#
#   2. No PR-time `dist plan` check. The previous workflow ran on PRs
#      to catch "this won't build" before merge. We rely on the stamp-loop
#      pre-merge review for that; if silent breakage of the release
#      pipeline becomes a problem, add a separate `pr-checks.yml` that
#      runs `dist plan` on pull_request events.
on:
  push:
    branches: [main]

# Don't run two releases in parallel — they'd race on `gh release create`
# and the npm publish gate.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # HAND-EDIT (AGT-1372 audit): enforced supply-chain gate. plan,
  # build-local-artifacts, host and publish-npm all `needs:` this job, so a
  # new advisory, license or source violation blocks the release. Runs
  # `cargo deny check` against deny.toml; needs network for the RustSec DB.
  # cargo-deny is built from crates.io at an exact version with --locked.
  deny:
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: cargo deny check
        run: cargo deny check

  plan:
    needs:
      - deny
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.version.outputs.tag }}
      tag-flag: --tag=${{ steps.version.outputs.tag }}
      publishing: ${{ steps.check_npm.outputs.published == 'false' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: read version from Cargo.toml
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "pm") | .version')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "could not read pm version via cargo metadata" >&2
            echo "expected a [package] block in Cargo.toml with name = \"pm\"" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "pm version: $VERSION"

      # HAND-EDIT (AGT-1372 audit r4): fail closed. Only a definite E404
      # from the registry means "not published"; any other failure
      # (network, registry 5xx, auth, malformed output) fails the job so a
      # flaky lookup can never start a release. Version goes via env.
      - name: check if already on npm
        id: check_npm
        env:
          PM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if out=$(npm view "@openthink/pm@${PM_VERSION}" version --json 2>/dev/null); then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@openthink/pm@${PM_VERSION} already on npm — skipping release."
          else
            code=$(printf '%s' "$out" | jq -r '.error.code // empty' 2>/dev/null || true)
            if [ "$code" = "E404" ]; then
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "@openthink/pm@${PM_VERSION} not on npm (E404) — proceeding."
            else
              echo "npm view failed with code '${code:-unknown}', not E404; refusing to release." >&2
              printf '%s\n' "$out" >&2
              exit 1
            fi
          fi

      # HAND-EDIT (AGT-1372 audit): dist generates an unverified
      # `curl | sh` installer here and uploads the binary as a `cargo-dist-cache`
      # artifact for later jobs. Instead every job that runs `dist` (plan,
      # build-local-artifacts, build-global-artifacts, host) runs
      # scripts/install-dist.sh, which downloads the pinned release tarball and
      # checks it against a SHA-256 committed in the repo. No binary is passed
      # between jobs, so the privileged `host` job never runs a dist binary it
      # did not verify itself.
      - name: Install dist (pinned, SHA-256 verified)
        if: steps.check_npm.outputs.published == 'false'
        shell: bash
        run: bash scripts/install-dist.sh
      - id: plan
        if: steps.check_npm.outputs.published == 'false'
        run: |
          # `dist host --steps=create` only computes the release manifest here; it makes
          # no GitHub write, so the workflow-level `contents: read` token suffices. The
          # release itself is created by `gh release create` in `host` (contents: write).
          # open-audit runs this identical step under `contents: read` and releases fine.
          dist host --steps=create --tag="${{ steps.version.outputs.tag }}" --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
      - deny
    # PATCHED: gate on `publishing` first (short-circuits the JSON parse
    # when the npm gate skipped, so val is empty). Also dropped the
    # pr_run_mode === 'upload' fallback since we no longer trigger on PRs.
    if: ${{ needs.plan.outputs.publishing == 'true' && fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    # HAND-EDIT: GH_TOKEN removed. This job runs crate build scripts; it
    # needs no GitHub API access (dist build only compiles and packages).
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      # HAND-EDIT (AGT-1372 audit r3): dist emits a container-only step here
      # that installs Rust with an unverified, unpinned `curl | sh` rustup,
      # plus `container: ${{ matrix.container ... }}` on the job. No pm
      # target uses a container (all native runners), so both are removed.
      # If a container target is ever added, reinstate with a pinned,
      # checksum-verified rustup-init.
      # HAND-EDIT (AGT-1372 audit): dist emits `${{ matrix.install_dist.run }}`
      # (an unverified curl | sh from the plan JSON). Use the pinned,
      # SHA-256-verified installer instead; see the plan job.
      - name: Install dist (pinned, SHA-256 verified)
        shell: bash
        run: bash scripts/install-dist.sh
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      # HAND-EDIT (AGT-1372 audit r4): plan-derived `packages_install` is
      # passed via env and run from a quoted variable, never interpolated
      # into the script text. (musl needs `musl-tools`, so the step stays.)
      - name: Install dependencies
        env:
          PACKAGES_INSTALL: ${{ matrix.packages_install }}
        run: |
          if [ -n "$PACKAGES_INSTALL" ]; then
            bash -c "$PACKAGES_INSTALL"
          fi
      # HAND-EDIT: dist has no setting to pass `--locked` to `cargo build`,
      # and will silently rewrite a stale Cargo.lock. Fail here instead, so
      # release binaries are always built from the committed lockfile.
      - name: Verify Cargo.lock is up to date
        run: cargo fetch --locked
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    # HAND-EDIT: GH_TOKEN removed; building installers/checksums needs no
    # GitHub API access.
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      # HAND-EDIT (AGT-1372 audit): dist downloads a `cargo-dist-cache`
      # artifact built by the plan job here. Re-install and re-verify instead.
      - name: Install dist (pinned, SHA-256 verified)
        shell: bash
        run: bash scripts/install-dist.sh
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - deny
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    # HAND-EDIT: also require the cargo-deny gate to have passed.
    if: ${{ always() && needs.deny.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    # HAND-EDIT (AGT-1372 audit r3): the credentialed job (contents: write,
    # id-token, attestations) runs behind the `release` GitHub environment
    # so deployment-branch rules / reviewers apply. See RELEASING.md.
    environment: release
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    # Matches what `dist generate` emits for github-attestations-phase = "host"
    # (plus `contents: write`, which this job needs for `gh release create`).
    # Attesting here rather than in build-local-artifacts keeps the OIDC
    # token away from jobs that run crate build scripts.
    permissions:
      "attestations": "write"
      "contents": "write"
      "id-token": "write"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      # HAND-EDIT (AGT-1372 audit): dist downloads a `cargo-dist-cache`
      # artifact built by the plan job here. Re-install and re-verify instead.
      - name: Install dist (pinned, SHA-256 verified)
        shell: bash
        run: bash scripts/install-dist.sh
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Attest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            artifacts/*
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  # NOTE: dist's default for this job uses NPM_TOKEN. We've patched it
  # to use OIDC Trusted Publishing instead (matches stamp-cli / ui-leaf
  # pattern). Re-running `dist init` or `dist generate` will overwrite
  # these patches — re-apply them after any regen. The patches are:
  #   1. permissions.id-token: write  (required for OIDC)
  #   2. node-version 22.x            (needed for npm-via-npx upgrade path)
  #   3. npx -y npm@11.20.0 publish   (Node 22 ships npm 10.x; OIDC publish
  #      auth needs npm 11.5.1+. Pinned to an exact version: this job holds
  #      id-token: write, so it must not run whatever `npm@latest` is today.
  #      Bump deliberately.)
  #   4. --provenance                 (attaches an SLSA build attestation)
  #   5. NODE_AUTH_TOKEN env removed  (OIDC supplies the credential)
  #   6. GH_TOKEN env removed         (nothing here calls the GitHub API)
  #   7. environment: npm-publish     (protected deployment environment;
  #      the npm Trusted Publisher is bound to this name, so the OIDC token
  #      is only accepted for runs that passed the environment's rules.
  #      Must exist in GitHub repo settings; see RELEASING.md)
  #   8. needs: deny                  (cargo-deny gate)
  publish-npm:
    needs:
      - plan
      - host
      - deny
    runs-on: "ubuntu-22.04"
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      PLAN: ${{ needs.plan.outputs.val }}
    # PATCHED: gate on `publishing` first so fromJson never runs on an
    # empty val (when the npm gate skipped). Belt-and-suspenders — the
    # `needs:` chain already prevents this job from running when host
    # skipped, but defensive consistency matters in CI.
    if: ${{ needs.plan.outputs.publishing == 'true' && (!fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases) }}
    steps:
      - name: Fetch npm packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - run: |
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq '.artifacts[] | select(endswith("-npm-package.tar.gz"))' --raw-output)
            npx -y npm@11.20.0 publish --access public --provenance "./npm/${pkg}"
          done

  # Generated by `dist generate` and kept as-is so regenerating stays a clean
  # diff (see RELEASING.md): it is the hook for announcement steps and does no work today.
  announce:
    needs:
      - plan
      - host
      - publish-npm
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-npm.result == 'skipped' || needs.publish-npm.result == 'success') }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
