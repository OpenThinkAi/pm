branches:
  main:
    required:
      - security
      - standards
      - product
    required_checks:
      - name: build
        run: cargo build --locked
      - name: test
        run: cargo test --locked --workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: fmt
        run: cargo fmt --check
      # AGT-2458: rebuild the vendored view libraries from their pinned
      # lockfile and fail if the committed bytes (or their checksum
      # manifest) differ. The build is byte-reproducible across runs,
      # machines (macOS, Linux) and bun 1.2.22 to 1.3.13.
      - name: vendor
        run: cd crates/pm/views-vendor && bun install --frozen-lockfile && bun build.ts && git diff --exit-code -- ../views/vendor vendor.sha256
reviewers:
  security:
    prompt: .stamp/reviewers/security.md
  standards:
    prompt: .stamp/reviewers/standards.md
  product:
    prompt: .stamp/reviewers/product.md
  example:
    prompt: .stamp/reviewers/example.md
