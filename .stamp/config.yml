branches:
  main:
    required:
      - security
      - standards
      - product
    required_checks:
      - name: build
        run: cargo build --locked
      - name: test
        run: cargo test --locked
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: fmt
        run: cargo fmt --check
reviewers:
  security:
    prompt: .stamp/reviewers/security.md
  standards:
    prompt: .stamp/reviewers/standards.md
  product:
    prompt: .stamp/reviewers/product.md
  example:
    prompt: .stamp/reviewers/example.md
